name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间 0:00, 6:00, 12:00, 18:00 自动触发更新
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动点击运行

# 避免多轮运行并发写同一分支导致 push 冲突
concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Proxy Cores and GeoLite databases
        uses: actions/cache@v4
        with:
          path: |
            xray
            sing-box
            Country.mmdb
            ASN.mmdb
          key: freesub-${{ runner.os }}-core-v4
          restore-keys: |
            freesub-${{ runner.os }}-core-

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Unit Tests
        run: python scripts/test_parse.py

      - name: Run Real-Prober and Classifier
        run: |
          python scripts/main.py --debug

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            for i in 1 2 3; do
              git pull --rebase || true
              if git push; then echo "推送成功"; break; fi
              echo "推送失败，第 $i 次重试..."
              sleep 5
            done
          fi